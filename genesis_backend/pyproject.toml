[project]
name = "genesis-backend"
version = "0.1.0"
description = "Enterprise Data Contract Sentinel System"
authors = [
    {name = "Gemini CLI"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.129.0,<0.130.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "sqlalchemy (>=2.0.46,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "qdrant-client (>=1.16.2,<2.0.0)",
    "celery (>=5.6.2,<6.0.0)",
    "structlog (>=25.5.0,<26.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "openai (>=2.20.0,<3.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "kafka-python (>=2.2.15,<3.0.0)",
    "python-multipart (>=0.0.22,<0.0.23)",
    "pydantic[email] (>=2.12.5,<3.0.0)",
    "cryptography (>=43.0.0,<44.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "aiomysql (>=0.2.0,<0.3.0)",
    "boto3 (>=1.42.73,<2.0.0)",
    "pymongo (>=4.16.0,<5.0.0)"
]

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "redis (>=7.2.1,<8.0.0)",
    "kafka-python (>=2.3.0,<3.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)"
]
