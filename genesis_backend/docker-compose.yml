services:
  postgres:
    image: postgres:15-alpine
    container_name: genesis_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-genesis_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-genesis_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: genesis_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: genesis_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:6333/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: genesis_jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: genesis_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: genesis_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: genesis_zookeeper:2181
      # PLAINTEXT_HOST allows host-machine clients on localhost:9092
      # PLAINTEXT allows in-Docker containers on genesis_kafka:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://genesis_kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 15s
      timeout: 10s
      retries: 10

  flink-jobmanager:
    image: flink:1.18.1
    container_name: genesis_flink_jobmanager
    command: jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
    ports:
      - "8081:8081"

  flink-taskmanager:
    image: flink:1.18.1
    container_name: genesis_flink_taskmanager
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager

  # ── Genesis Ingestion Gateway (Go) ──────────────────────────────────────────
  # High-performance Schemaless event collector. Authenticates via in-memory
  # key store backed by Redis, and writes raw payloads to Kafka (ods_raw_events).
  genesis-ingester:
    build:
      context: ../genesis_ingester
      dockerfile: Dockerfile
    container_name: genesis_ingester
    ports:
      - "8090:8080" # host:8090 → container:8080
    environment:
      LISTEN_ADDR: ":8080"
      KAFKA_BROKERS: "genesis_kafka:29092" # internal Docker network broker
      KAFKA_TOPIC: "ods_raw_events"
      REDIS_ADDR: "genesis_redis:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      MAX_BODY_BYTES: "524288"
      RATE_LIMIT_PER_SEC: "200"
      RATE_LIMIT_BURST: "500"
      INTERNAL_API_KEY: "${INGESTER_INTERNAL_KEY:-change-me-in-production}"
      PRODUCER_QUEUE_SIZE: "10000"
      PRODUCER_BATCH_SIZE: "500"
      PRODUCER_FLUSH_MS: "500"
      LOG_FORMAT: "json"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:


